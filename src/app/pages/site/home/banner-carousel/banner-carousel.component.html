<section class="banner-carousel" *ngIf="slides.length">
  <div class="banner-carousel__viewport">
    <div
      class="banner-carousel__slide"
      *ngFor="let slide of slides; let i = index"
      [class.active]="i === currentIndex()"
      [class.entering]="i === currentIndex() && isTransitioning()"
      [attr.aria-hidden]="i !== currentIndex()"
    >
      <picture>
        <source *ngIf="slide.mobileImage" media="(max-width: 720px)" [attr.srcset]="slide.mobileImage" />
        <img [src]="slide.image" [alt]="slide.alt" loading="eager" />
      </picture>
    </div>
  </div>

  <div class="banner-carousel__overlay" aria-hidden="true"></div>
</section>

<div class="banner-cta-bar">
  <a href="#productos" class="site-button banner-cta-bar__button">
    Ver productos
  </a>
</div>
